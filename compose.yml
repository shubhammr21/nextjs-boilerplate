services:
  db:
    image: postgres:17
    container_name: nextstarter-db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - nextstarter:/var/lib/postgresql/data

volumes:
  nextstarter:
